# Builds the PlayerOne desktop app and CLI for every OS on each push to main that touches desktop/.
# Windows x64, x86 and ARM64, macOS universal (Intel + Apple Silicon), Linux x64 (AppImage + deb).
name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

# tags publish a GitHub Release, so the website can link to /releases/latest/download/<file>
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, bundles: nsis, ext: .exe }
          - { os: windows-latest, target: i686-pc-windows-msvc, name: windows-x86, bundles: nsis, ext: .exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: windows-arm64, bundles: nsis, ext: .exe }
          - { os: macos-latest, target: universal-apple-darwin, name: macos-universal, bundles: 'app,dmg', ext: '' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64, bundles: deb, ext: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev file wget build-essential clang libclang-dev libspa-0.2-dev libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App dependencies
        working-directory: desktop/app
        run: npm ci || npm install

      # the CLI first, so every OS ships at least the engine even if packaging the app fails
      - name: Build CLI
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release -p playerone --target ${{ matrix.target }}

      - name: Build app
        working-directory: desktop/app
        continue-on-error: true
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # stable file names, so download links never change between versions
      - name: Collect downloads
        shell: bash
        run: |
          mkdir -p out
          T=target/${{ matrix.target }}/release
          for f in $T/bundle/nsis/*-setup.exe; do [ -f "$f" ] && cp "$f" "out/PlayerOne-${{ matrix.name }}-setup.exe"; done
          for f in $T/bundle/dmg/*.dmg; do [ -f "$f" ] && cp "$f" "out/PlayerOne-macos.dmg"; done
          for f in $T/bundle/deb/*.deb; do [ -f "$f" ] && cp "$f" "out/PlayerOne-linux-amd64.deb"; done
          [ -f "$T/playerone${{ matrix.ext }}" ] && cp "$T/playerone${{ matrix.ext }}" "out/playerone-cli-${{ matrix.name }}${{ matrix.ext }}" || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: playerone-${{ matrix.name }}
          path: desktop/out/*
          if-no-files-found: warn

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/*
          fail_on_unmatched_files: false
          make_latest: true
