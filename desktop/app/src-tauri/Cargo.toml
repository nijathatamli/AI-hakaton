[package]
name = "playerone-app"
version = "0.1.0"
edition = "2021"
description = "PlayerOne desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
playerone = { path = "../../engine" }
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
window-vibrancy = "0.6"
dirs = "6"
