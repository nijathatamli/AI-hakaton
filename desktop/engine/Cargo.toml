[package]
name = "playerone"
version = "0.1.0"
edition = "2021"
description = "AI playtester: a free local model plays, a big model directs, engine consoles tell the truth"
license = "MIT"

[lib]
name = "playerone"
path = "src/lib.rs"

[[bin]]
name = "playerone"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
enigo = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
rand = "0.9"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
